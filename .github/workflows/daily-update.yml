name: Daily BTC risk score update
on:
  schedule:
    # 00:15 UTC daily — after the day's daily candle has closed
    - cron: '15 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run risk score update
        run: python btc_risk_score.py --update
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/btc_risk_history.json data/btc_prices_raw.json
          git diff --cached --quiet || git commit -m "Daily BTC risk score update"
          git push
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc_risk_alert.py
